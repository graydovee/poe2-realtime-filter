name: build-and-release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: harbor.graydove.cn
  IMAGE: harbor.graydove.cn/apps/poe2-filter
  REPO: git.graydove.cn/graydove/poe2-filter.git
  BRANCH: main

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: linux-amd64, arch: amd64 }
          - { runner: linux-arm64, arch: arm64 }
    env:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
    steps:
      - name: checkout
        run: |
          set -eu
          git clone --branch '${{ github.ref_name }}' --depth 1 \
            "https://${CI_GIT_USER}:${CI_GIT_TOKEN}@${REPO}" .
      - name: build and push
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          mkdir -p "${HOME}/.docker"
          AUTH="$(printf '%s' "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > "${HOME}/.docker/config.json"
          docker build -t "${IMAGE}:${TAG}-${{ matrix.arch }}" .
          docker push "${IMAGE}:${TAG}-${{ matrix.arch }}"

  merge:
    name: merge manifest
    needs: [build]
    runs-on: linux-amd64
    env:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: merge per-arch images
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          mkdir -p "${HOME}/.docker"
          AUTH="$(printf '%s' "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > "${HOME}/.docker/config.json"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  desktop-release:
    name: desktop Windows amd64 release
    runs-on: linux-amd64
    env:
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: checkout
        run: |
          set -eu
          git clone --branch "$RELEASE_TAG" --depth 1 \
            "https://${CI_GIT_USER}:${CI_GIT_TOKEN}@${REPO}" .
      - name: build Windows amd64
        run: |
          set -eu
          BUILD_IMAGE="poe2-filter-windows-build:${RELEASE_TAG}"
          docker build --file .gitea/windows-amd64.Dockerfile --tag "$BUILD_IMAGE" .
          CONTAINER="$(docker create "$BUILD_IMAGE")"
          trap 'docker rm "$CONTAINER" >/dev/null' EXIT
          FILE="poe2-filter-windows-amd64-${RELEASE_TAG}.exe"
          docker cp "${CONTAINER}:/poe2-filter-client.exe" "$FILE"
          sha256sum "$FILE" > "$FILE.sha256"
      - name: publish Gitea release assets
        run: |
          set -eu
          API="https://git.graydove.cn/api/v1/repos/graydove/poe2-filter/releases"
          AUTH="$(printf '%s' "${CI_GIT_USER}:${CI_GIT_TOKEN}" | base64 | tr -d '\n')"
          release_status="$(curl -sS -o release.json -w '%{http_code}' \
            -H "Authorization: Basic ${AUTH}" "$API/tags/$RELEASE_TAG")"
          if [ "$release_status" = 404 ]; then
            python3 -c 'import json,sys; print(json.dumps(dict(tag_name=sys.argv[1], name=sys.argv[1], body="Windows amd64 client")))' \
              "$RELEASE_TAG" > release-request.json
            curl -fsS -H "Authorization: Basic ${AUTH}" -H 'Content-Type: application/json' \
              --data-binary @release-request.json "$API" > release.json
          elif [ "$release_status" != 200 ]; then
            echo "Could not read release for $RELEASE_TAG (HTTP $release_status)" >&2
            exit 1
          fi
          ID="$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')"
          FILE="poe2-filter-windows-amd64-${RELEASE_TAG}.exe"
          for ASSET in "$FILE" "$FILE.sha256"; do
            if python3 -c 'import json,sys; sys.exit(not any(a["name"] == sys.argv[1] for a in json.load(open("release.json"))["assets"]))' "$ASSET"; then
              echo "$ASSET is already published"
              continue
            fi
            curl -fsS -H "Authorization: Basic ${AUTH}" \
              -F "attachment=@${ASSET}" "$API/${ID}/assets?name=${ASSET}"
          done

  bump-chart:
    name: bump chart tag
    needs: [merge]
    runs-on: linux-amd64
    env:
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
    steps:
      - name: update image tag in project chart
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          git clone --branch "${BRANCH}" "https://${CI_GIT_USER}:${CI_GIT_TOKEN}@${REPO}" /tmp/app
          cd /tmp/app
          sed -i "s|^  tag: .*|  tag: ${TAG}|" charts/poe2-filter/values.yaml
          grep -q "^  tag: ${TAG}$" charts/poe2-filter/values.yaml \
            || { echo "chart image tag was not updated" >&2; exit 1; }
          if git diff --quiet; then
            echo "chart tag already points to ${TAG}"
            exit 0
          fi
          git config user.name "graydove-ci"
          git config user.email "ci@graydove.cn"
          git commit -am "poe2-filter: 镜像升级到 ${TAG}（CI 自动提交）"
          git push origin "${BRANCH}"
