name: build-and-release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: harbor.graydove.cn
  IMAGE: harbor.graydove.cn/apps/poe2-filter
  REPO: git.graydove.cn/graydove/poe2-filter.git
  BRANCH: main

jobs:
  build:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: linux-amd64, arch: amd64 }
          - { runner: linux-arm64, arch: arm64 }
    env:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
    steps:
      - name: checkout
        run: |
          set -eu
          git clone --branch '${{ github.ref_name }}' --depth 1 \
            "https://${CI_GIT_USER}:${CI_GIT_TOKEN}@${REPO}" .
      - name: build and push
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          mkdir -p "${HOME}/.docker"
          AUTH="$(printf '%s' "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > "${HOME}/.docker/config.json"
          docker build -t "${IMAGE}:${TAG}-${{ matrix.arch }}" .
          docker push "${IMAGE}:${TAG}-${{ matrix.arch }}"

  merge:
    name: merge manifest
    needs: [build]
    runs-on: linux-amd64
    env:
      HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
      HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
    steps:
      - name: merge per-arch images
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          mkdir -p "${HOME}/.docker"
          AUTH="$(printf '%s' "${HARBOR_USERNAME}:${HARBOR_PASSWORD}" | base64 | tr -d '\n')"
          printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > "${HOME}/.docker/config.json"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  desktop-release:
    name: desktop Windows amd64 release
    needs: [merge]
    runs-on: linux-amd64
    env:
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
    steps:
      - name: checkout
        run: |
          set -eu
          git clone --branch '${{ github.ref_name }}' --depth 1 \
            "https://${CI_GIT_USER}:${CI_GIT_TOKEN}@${REPO}" .
      - name: build Windows amd64
        run: |
          set -eu
          test -f desktop/Cargo.lock
          if [ "$(id -u)" -eq 0 ]; then APT=apt-get; else APT="sudo apt-get"; fi
          $APT update
          $APT install -y --no-install-recommends curl ca-certificates mingw-w64
          if command -v rustup >/dev/null; then
            RUSTUP=rustup
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.96.1
            RUSTUP=/root/.cargo/bin/rustup
          fi
          export PATH="/tmp/poe2-cargo/bin:/root/.cargo/bin:${PATH}"
          $RUSTUP target add x86_64-pc-windows-gnu
          cargo build --release --target x86_64-pc-windows-gnu --manifest-path desktop/Cargo.toml
          cp desktop/target/x86_64-pc-windows-gnu/release/poe2-filter-client.exe "poe2-filter-windows-amd64-${{ github.ref_name }}.exe"
          sha256sum "poe2-filter-windows-amd64-${{ github.ref_name }}.exe" > "poe2-filter-windows-amd64-${{ github.ref_name }}.exe.sha256"
      - name: publish Gitea release assets
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          AUTH="$(printf '%s' "${CI_GIT_USER}:${CI_GIT_TOKEN}" | base64 | tr -d '\n')"
          RELEASE="$(curl -fsS -X POST -H "Authorization: Basic ${AUTH}" -H 'Content-Type: application/json' \
            -d "{\"tag_name\":\"${TAG}\",\"name\":\"${TAG}\",\"body\":\"Windows amd64 client\"}" \
            "https://git.graydove.cn/api/v1/repos/graydove/poe2-filter/releases" || true)"
          ID="$(printf '%s' "$RELEASE" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id", ""))')"
          if [ -z "$ID" ]; then
            ID="$(curl -fsS -H "Authorization: Basic ${AUTH}" "https://git.graydove.cn/api/v1/repos/graydove/poe2-filter/releases/tags/${TAG}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          fi
          for FILE in "poe2-filter-windows-amd64-${TAG}.exe" "poe2-filter-windows-amd64-${TAG}.exe.sha256"; do
            curl -fsS -X POST -H "Authorization: Basic ${AUTH}" \
              -F "attachment=@${FILE}" "https://git.graydove.cn/api/v1/repos/graydove/poe2-filter/releases/${ID}/assets?name=${FILE}"
          done

  bump-chart:
    name: bump chart tag
    needs: [merge]
    runs-on: linux-amd64
    env:
      CI_GIT_USER: ${{ secrets.CI_GIT_USER }}
      CI_GIT_TOKEN: ${{ secrets.CI_GIT_TOKEN }}
    steps:
      - name: update image tag in project chart
        run: |
          set -eu
          TAG='${{ github.ref_name }}'
          git clone --branch "${BRANCH}" "https://${CI_GIT_USER}:${CI_GIT_TOKEN}@${REPO}" /tmp/app
          cd /tmp/app
          sed -i "s|^  tag: .*|  tag: ${TAG}|" charts/poe2-filter/values.yaml
          grep -q "^  tag: ${TAG}$" charts/poe2-filter/values.yaml \
            || { echo "chart image tag was not updated" >&2; exit 1; }
          if git diff --quiet; then
            echo "chart tag already points to ${TAG}"
            exit 0
          fi
          git config user.name "graydove-ci"
          git config user.email "ci@graydove.cn"
          git commit -am "poe2-filter: 镜像升级到 ${TAG}（CI 自动提交）"
          git push origin "${BRANCH}"
