{{- if and .Values.auth.oidc.enabled .Values.auth.oidc.clientId .Values.auth.oidc.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.oidc.existingSecret }}
  labels:
    {{- include "poe2-filter.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.oidc.clientIdKey }}: {{ .Values.auth.oidc.clientId | quote }}
  {{ .Values.auth.oidc.clientSecretKey }}: {{ .Values.auth.oidc.clientSecret | quote }}
{{- end }}
