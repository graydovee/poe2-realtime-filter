apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "poe2-filter.fullname" . }}
  labels:
    {{- include "poe2-filter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "poe2-filter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "poe2-filter.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: DATA_DIR
              value: /data
            - name: POE2_LEAGUE
              value: {{ .Values.market.league | quote }}
            - name: MARKET_SNAPSHOT_URL
              value: {{ .Values.market.sourceUrl | quote }}
            - name: MARKET_SYNC_INTERVAL_MS
              value: {{ printf "%.0f" .Values.market.intervalMs | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
        - name: market-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "worker/price-sync.mjs"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: DATA_DIR
              value: /data
            - name: POE2_LEAGUE
              value: {{ .Values.market.league | quote }}
            - name: MARKET_SNAPSHOT_URL
              value: {{ .Values.market.sourceUrl | quote }}
            - name: MARKET_SYNC_INTERVAL_MS
              value: {{ printf "%.0f" .Values.market.intervalMs | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "poe2-filter.fullname" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
