replicaCount: 1

image:
  repository: harbor.graydove.cn/apps/poe2-filter
  tag: v0.4.0
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: poe2-filter.qaer.cn
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 2Gi
  storageClass: ""

market:
  league: Standard
  intervalMs: 21600000
  sourceUrl: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  fsGroup: 1001

securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false

nodeSelector: {}
tolerations: []
affinity: {}


auth:
  oidc:
    enabled: false
    issuer: https://auth.qaer.io
    # Set these only in the private charts overlay; the template creates the Secret.
    clientId: ""
    clientSecret: ""
    existingSecret: poe2-filter-oidc
    clientIdKey: client-id
    clientSecretKey: client-secret
    publicOrigin: https://poe2-filter.qaer.cn
